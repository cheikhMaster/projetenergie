version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Pass"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - senelec-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - senelec-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:YourStrong!Pass@db/SmartSenelec?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=senelec
      - KEYCLOAK_CLIENT_ID=senelec-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - keycloak
    networks:
      - senelec-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - senelec-network

networks:
  senelec-network:
    driver: bridge
